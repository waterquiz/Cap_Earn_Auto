function getSavedConfig() {
    try {
        const raw = localStorage.getItem('CT_ADVANCED_SETTINGS');
        return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
}

function renderWebPanels(count, customCols, customHeight) {
    const grid = document.getElementById('panels-grid');
    if (!grid) return;
    const cfg = getSavedConfig() || {};
    const panels = count || cfg.panels || 12;
    const cols = customCols || cfg.columns || (panels <= 2 ? 2 : panels <= 6 ? 3 : 4);
    const height = customHeight || cfg.height || 520;
    
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    
    for (let i = 0; i < panels; i++) {
        const iframe = document.createElement('iframe');
        iframe.src = `panel.html?panelId=${i + 1}`;
        iframe.className = 'panel-frame';
        iframe.style.height = height + 'px';
        iframe.allow = 'autoplay';
        grid.appendChild(iframe);
    }
}

function initSettingsModal() {
    const modal = document.getElementById('ct-settings-modal');
    const settingsBtn = document.getElementById('ct-settings-btn');
    const closeBtn = document.getElementById('ct-modal-close-btn');
    const applyBtn = document.getElementById('modal-apply-btn');
    const resetBtn = document.getElementById('modal-reset-btn');

    if (!modal || !settingsBtn) return;

    const colSlider = document.getElementById('modal-column-slider');
    const colInput = document.getElementById('modal-column-input');
    const heightSlider = document.getElementById('modal-height-slider');
    const heightInput = document.getElementById('modal-height-input');
    const panelCountSlider = document.getElementById('modal-panel-count-slider');
    const panelCountInput = document.getElementById('modal-panel-count-input');
    const proxyMode = document.getElementById('modal-proxy-mode');
    const manualProxyGroup = document.getElementById('modal-manual-proxy-group');
    const manualProxies = document.getElementById('modal-manual-proxies');
    const autoSolve = document.getElementById('modal-auto-solve');
    const solverEngine = document.getElementById('modal-solver-engine');

    function syncPair(slider, input) {
        if (!slider || !input) return;
        slider.addEventListener('input', () => { input.value = slider.value; });
        input.addEventListener('input', () => { 
            let v = parseInt(input.value);
            if (!isNaN(v)) slider.value = v;
        });
    }
    syncPair(colSlider, colInput);
    syncPair(heightSlider, heightInput);
    syncPair(panelCountSlider, panelCountInput);

    if (proxyMode && manualProxyGroup) {
        proxyMode.addEventListener('change', () => {
            manualProxyGroup.style.display = proxyMode.value === 'manual' ? 'block' : 'none';
        });
    }

    function populateModalFields() {
        const cfg = getSavedConfig() || {};
        const currentPanels = parseInt(document.getElementById('ct-panel-count')?.value) || 12;
        if (colSlider) colSlider.value = cfg.columns || 4;
        if (colInput) colInput.value = cfg.columns || 4;
        if (heightSlider) heightSlider.value = cfg.height || 520;
        if (heightInput) heightInput.value = cfg.height || 520;
        if (panelCountSlider) panelCountSlider.value = cfg.panels || currentPanels;
        if (panelCountInput) panelCountInput.value = cfg.panels || currentPanels;
        if (proxyMode) proxyMode.value = cfg.proxyMode || 'none';
        if (manualProxies) manualProxies.value = cfg.manualProxies || '';
        if (autoSolve) autoSolve.value = cfg.autoSolve || 'recaptcha_v2_local';
        if (solverEngine) solverEngine.value = cfg.solverEngine || 'captchasonic';
        if (manualProxyGroup) manualProxyGroup.style.display = (cfg.proxyMode === 'manual') ? 'block' : 'none';
    }

    settingsBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        populateModalFields();
        modal.style.display = 'flex';
    });

    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });
    }

    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });

    if (applyBtn) {
        applyBtn.addEventListener('click', () => {
            const columns = parseInt(colInput.value) || 4;
            const height = parseInt(heightInput.value) || 520;
            const panels = parseInt(panelCountInput.value) || 12;
            const cfg = {
                columns: columns,
                height: height,
                panels: panels,
                proxyMode: proxyMode ? proxyMode.value : 'none',
                manualProxies: manualProxies ? manualProxies.value : '',
                autoSolve: autoSolve ? autoSolve.value : 'recaptcha_v2_local',
                solverEngine: solverEngine ? solverEngine.value : 'captchasonic'
            };
            localStorage.setItem('CT_ADVANCED_SETTINGS', JSON.stringify(cfg));
            
            // Update top bar panel count input
            const headerCount = document.getElementById('ct-panel-count');
            if (headerCount) headerCount.value = panels;

            // Re-render live
            renderWebPanels(panels, columns, height);

            applyBtn.textContent = 'Saved!';
            setTimeout(() => {
                applyBtn.innerHTML = '<i class="fas fa-check"></i> Save & Apply';
                modal.style.display = 'none';
            }, 400);
        });
    }

    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            if (colSlider) { colSlider.value = 4; colInput.value = 4; }
            if (heightSlider) { heightSlider.value = 520; heightInput.value = 520; }
            if (panelCountSlider) { panelCountSlider.value = 12; panelCountInput.value = 12; }
            if (proxyMode) proxyMode.value = 'none';
            if (manualProxies) manualProxies.value = '';
            if (autoSolve) autoSolve.value = 'recaptcha_v2_local';
            if (solverEngine) solverEngine.value = 'captchasonic';
            if (manualProxyGroup) manualProxyGroup.style.display = 'none';
        });
    }
}

        function initializeCTTimer() {
            console.log('[CT Timer] Initializing timer from Firebase...');
            const { ipcRenderer } = require('electron');
            
            // Request expiration data from main process (same account)
            ipcRenderer.send('get-expiration-data');
            
            // Listen for expiration updates
            ipcRenderer.on('expiration-update', (event, data) => {
                console.log('[CT Timer] Received expiration data:', data);
                updateCTTimerDisplay(data);
            });
            
            // Update timer every second
            setInterval(() => {
                const timerEl = document.getElementById('ct-time-left-display');
                if (timerEl && timerEl.dataset.expirationDate) {
                    const timeLeft = calculateTimeLeft(timerEl.dataset.expirationDate);
                    timerEl.textContent = timeLeft;
                }
            }, 1000);
        }

        function updateCTTimerDisplay(data) {
            const timerEl = document.getElementById('ct-time-left-display');
            const container = document.getElementById('ct-expiration-container');
            
            if (!timerEl || !container) return;
            
            if (data && data.expirationDate) {
                timerEl.dataset.expirationDate = data.expirationDate;
                const timeLeft = calculateTimeLeft(data.expirationDate);
                timerEl.textContent = timeLeft;
                
                // Check if expired or near expiration
                const daysLeft = Math.ceil((new Date(data.expirationDate) - new Date()) / (1000 * 60 * 60 * 24));
                
                if (daysLeft <= 0) {
                    container.style.border = '1px solid rgba(255, 59, 48, 0.5)';
                    timerEl.style.color = '#ff3b30';
                } else if (daysLeft <= 7) {
                    container.style.border = '1px solid rgba(255, 204, 0, 0.5)';
                    timerEl.style.color = '#ffcc00';
                } else {
                    container.style.border = '1px solid var(--border-color)';
                    timerEl.style.color = 'var(--text-color)';
                }
            } else {
                timerEl.textContent = '';
            }
        }

        function calculateTimeLeft(expirationDate) {
            const now = new Date();
            const expiry = new Date(expirationDate);
            const diffMs = expiry - now;
            
            if (diffMs <= 0) {
                return 'Expired';
            }
            
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            
            if (days > 0) {
                return `${days}d ${hours}h`;
            } else {
                const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                return `${hours}h ${minutes}m`;
            }
        }

                        currentStreak: 0,
                        totalDays: 0,
                        lastUploadDate: null,
                        uploadHistory: [],
                        pendingVerification: [],
                        discountEligible: false
                    };
                    fs.writeFileSync(filePath, JSON.stringify(initialData, null, 2));
                    return initialData;
                }
            } catch (error) {
                console.error('[CT Daily Task] Error loading data:', error);
                return { currentStreak: 0, totalDays: 0, lastUploadDate: null, uploadHistory: [], pendingVerification: [], discountEligible: false };

(function() {
    // 1. Intercept document.createElement & document.createElementNS for 'webview'
    const origCreateElement = document.createElement;
    const origCreateElementNS = document.createElementNS;

    function setupWebviewMethods(el) {
        if (!el || el._webviewSetupDone) return el;
        el._webviewSetupDone = true;

        el.clearStorageData = function() { return Promise.resolve(); };
        el.setProxy = function() { return Promise.resolve(); };
        el.setCookies = function() { return Promise.resolve(); };
        el.getCookies = function() { return Promise.resolve([]); };
        el.setUserAgent = function() { return Promise.resolve(); };
        el.reload = function() { 
            try { 
                if (el.contentWindow) el.contentWindow.location.reload(); 
            } catch(e){} 
        };
        el.stop = function() { 
            try { 
                if (el.contentWindow) el.contentWindow.stop(); 
            } catch(e){} 
        };
        el.send = function() {};
        el.openDevTools = function() {};
        el.closeDevTools = function() {};
        el.isDevToolsOpened = function() { return false; };
        el.canGoBack = function() { return false; };
        el.canGoForward = function() { return false; };
        el.getWebContents = function() { return { id: 1, isDestroyed: function() { return false; } }; };
        el.setZoomFactor = function() { return Promise.resolve(); };
        el.getZoomFactor = function(cb) { if (cb) cb(1.0); return Promise.resolve(1.0); };
        el.executeJavaScript = function() { return Promise.resolve(); };

        el.findInPage = function(text, options) {
            try {
                if (el.contentDocument && el.contentDocument.body) {
                    var found = el.contentDocument.body.innerText.indexOf(text) !== -1;
                    if (found) {
                        setTimeout(function() {
                            var evt = new Event('found-in-page');
                            evt.result = { matches: 1, activeMatchOrdinal: 1 };
                            el.dispatchEvent(evt);
                        }, 50);
                    }
                }
            } catch(e) {}
            return 1;
        };
        el.stopFindInPage = function() {};

        el.loadURL = function(url, options) {
            var self = this;
            var htmlContent = '';
            var isDataUrl = false;
            
            if (typeof url === 'string' && url.indexOf('data:text/html,') === 0) {
                htmlContent = decodeURIComponent(url.substring('data:text/html,'.length));
                isDataUrl = true;
            } else if (typeof url === 'string' && url.indexOf('data:text/html;base64,') === 0) {
                try {
                    htmlContent = atob(url.substring('data:text/html;base64,'.length));
                    isDataUrl = true;
                } catch(e) {
                    console.error('[Webview Shim] Base64 decode error:', e);
                }
            }
            
            if (!isDataUrl) {
                self.src = url;
                setTimeout(function() {
                    self.dispatchEvent(new Event('did-navigate'));
                    self.dispatchEvent(new Event('did-finish-load'));
                }, 50);
                return Promise.resolve();
            }

            var baseUrl = (options && options.baseURLForDataURL) ? options.baseURLForDataURL : 'https://worker.captchatypers.com/';
            var frameId = 'frame_' + Math.random().toString(36).substring(2) + '_' + Date.now();
            self.name = frameId;

            var captchaServer = (window.CAPTCHA_SERVER_URL || localStorage.getItem('CAPTCHA_SERVER_URL') || window.location.origin || 'https://capearnauto-production.up.railway.app').replace(/\/+$/, '');
            
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', captchaServer + '/store_captcha_frame', false); // Synchronous ensures backend saves before navigation
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.send(JSON.stringify({ id: frameId, html: htmlContent, domain: baseUrl }));
            } catch (err) {
                console.error('[Webview Shim] Error storing frame:', err);
            }

            self.src = captchaServer + '/render_captcha_frame?id=' + frameId;

            setTimeout(function() {
                var loadedEvt = new Event('console-message');
                loadedEvt.message = 'frame loaded !';
                self.dispatchEvent(loadedEvt);

                var loadedEvt2 = new Event('console-message');
                loadedEvt2.message = 'frame-onload';
                self.dispatchEvent(loadedEvt2);

                var activeEvt = new Event('console-message');
                activeEvt.message = 'detect-active';
                self.dispatchEvent(activeEvt);

                self.dispatchEvent(new Event('did-finish-load'));
                self.dispatchEvent(new Event('did-navigate'));
            }, 150);

            return Promise.resolve();
        };

        return el;
    }

    document.createElement = function(tagName, options) {
        var tag = (typeof tagName === 'string') ? tagName.toLowerCase() : '';
        if (tag === 'webview') {
            var iframe = origCreateElement.call(document, 'iframe', options);
            iframe.setAttribute('data-is-webview', 'true');
            iframe.setAttribute('class', 'ct-webview-frame');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.minHeight = '480px';
            iframe.style.border = 'none';
            iframe.style.display = 'block';
            iframe.style.backgroundColor = '#ffffff';
            return setupWebviewMethods(iframe);
        }
        return origCreateElement.call(document, tagName, options);
    };

    document.createElementNS = function(ns, qualifiedName) {
        if (typeof qualifiedName === 'string' && qualifiedName.toLowerCase() === 'webview') {
            return document.createElement('webview');
        }
