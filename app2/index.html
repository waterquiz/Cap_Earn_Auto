function renderWebPanels(count) {
    const grid = document.getElementById('panels-grid');
    if (!grid) return;
    grid.innerHTML = '';
    const cols = count <= 2 ? 2 : count <= 6 ? 3 : 4;
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    for (let i = 0; i < count; i++) {
        const iframe = document.createElement('iframe');
        iframe.src = `panel.html?panelId=${i + 1}`;
        iframe.className = 'panel-frame';
        iframe.allow = 'autoplay';
        grid.appendChild(iframe);
    }
}

        function updateCTTimerDisplay(data) {
            const timerEl = document.getElementById('ct-time-left-display');
            const container = document.getElementById('ct-expiration-container');
            
            if (!timerEl || !container) return;
            
            if (data && data.expirationDate) {
                timerEl.dataset.expirationDate = data.expirationDate;
                const timeLeft = calculateTimeLeft(data.expirationDate);
                timerEl.textContent = timeLeft;
                
                // Check if expired or near expiration
                const daysLeft = Math.ceil((new Date(data.expirationDate) - new Date()) / (1000 * 60 * 60 * 24));
                
                if (daysLeft <= 0) {
                    container.style.border = '1px solid rgba(255, 59, 48, 0.5)';
                    timerEl.style.color = '#ff3b30';
                } else if (daysLeft <= 7) {
                    container.style.border = '1px solid rgba(255, 204, 0, 0.5)';
                    timerEl.style.color = '#ffcc00';
                } else {
                    container.style.border = '1px solid var(--border-color)';
                    timerEl.style.color = 'var(--text-color)';
                }
            } else {
                timerEl.textContent = '';
            }
        }

        function calculateTimeLeft(expirationDate) {
            const now = new Date();
            const expiry = new Date(expirationDate);
            const diffMs = expiry - now;
            
            if (diffMs <= 0) {
                return 'Expired';
            }
            
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            
            if (days > 0) {
                return `${days}d ${hours}h`;
            } else {
                const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                return `${hours}h ${minutes}m`;
            }
        }

                    ipcRenderer.send('open-daily-task-guide');
                });
            }
            
            // Listen for verification results
            ipcRenderer.on('proof-verified', (event, data) => {
                dailyData = loadDailyData(dailyDataPath);
                if (data.approved) {
                    const today = new Date().toDateString();
                    dailyData.lastUploadDate = today;
                    dailyData.currentStreak += 1;
                    dailyData.totalDays += 1;
                    
                    if (dailyData.currentStreak >= 10) {
                        dailyData.discountEligible = true;
                    }
                    
                    fs.writeFileSync(dailyDataPath, JSON.stringify(dailyData, null, 2));
                    updateCTDailyTaskUI(dailyData);
                    
                    new Notification('✅ Verifikasi Berhasil!', {
                        body: `Upload video Anda telah diverifikasi! Streak: ${dailyData.currentStreak} hari`,
                        icon: '../template/CK/Logo.png'
                    });
                }
            });
        }

        function loadDailyData(filePath) {
            const fs = require('fs');
            try {
                if (fs.existsSync(filePath)) {
                    return JSON.parse(fs.readFileSync(filePath, 'utf8'));
                } else {
                    const initialData = {
                        currentStreak: 0,
                        totalDays: 0,
                        lastUploadDate: null,
                        uploadHistory: [],
                        pendingVerification: [],
                        discountEligible: false
                    };
                    fs.writeFileSync(filePath, JSON.stringify(initialData, null, 2));
                    return initialData;
                }
            } catch (error) {
                console.error('[CT Daily Task] Error loading data:', error);
                return { currentStreak: 0, totalDays: 0, lastUploadDate: null, uploadHistory: [], pendingVerification: [], discountEligible: false };
            }
        }

        function updateCTDailyTaskUI(dailyData) {
            const streakEl = document.getElementById('ct-daily-streak');
            const progressFill = document.getElementById('ct-daily-progress-fill');
            const uploadBtn = document.getElementById('ct-upload-proof-btn');
            
            if (streakEl) {
                streakEl.textContent = `${dailyData.currentStreak} hari`;
            }
            
            const progressPercent = Math.min((dailyData.currentStreak / 30) * 100, 100);
            if (progressFill) {
                progressFill.style.width = `${progressPercent}%`;
            }
            
            const today = new Date().toDateString();
            const uploadedToday = dailyData.lastUploadDate === today;
            
            if (uploadBtn && uploadedToday) {
                uploadBtn.classList.add('completed');
                uploadBtn.innerHTML = '<i class="fas fa-check"></i> Sudah Upload';
            }
        }

        // CT Balance Display (dummy for now)
        function initializeCTBalance() {
            console.log('[CT Balance] Initializing balance display (dummy)...');
            const { ipcRenderer } = require('electron');
            
            // Listen for balance updates from main app
            ipcRenderer.on('balance-update', (event, data) => {
                console.log('[CT Balance] Received balance update:', data);
                updateCTBalanceDisplay(data);
            });
            
            // Request initial balance data
            ipcRenderer.send('get-balance-data');
        }

        function updateCTBalanceDisplay(data) {
            const usdEl = document.getElementById('ct-total-balance-display-usd');
            const idrEl = document.getElementById('ct-total-balance-display-idr');
            
            if (usdEl && data.usd !== undefined) {
                usdEl.textContent = `$${parseFloat(data.usd).toFixed(2)}`;
            }
            
            if (idrEl && data.idr !== undefined) {
                idrEl.textContent = `Rp ${parseInt(data.idr).toLocaleString('id-ID')}`;
            }
        }

        // Custom scrollbar dragging & update logic
        (function() {
            const scrollbarContainer = document.getElementById('ct-scrollbar-container');
            const scrollbarThumb = document.getElementById('ct-scrollbar-thumb');
            if (!scrollbarContainer || !scrollbarThumb) return;
            
            let isDraggingScrollbar = false;
            let startDragY = 0;
            let startThumbTop = 0;
            let currentScrollY = 0;
            let maxScrollY = 0;

            function updateScrollbarThumb(scrollY, maximumScrollY) {
                currentScrollY = scrollY;
                maxScrollY = maximumScrollY;
                
                if (maxScrollY <= 0) {
                    scrollbarContainer.style.display = 'none';
                    return;
                }
                scrollbarContainer.style.display = 'block';

                const containerHeight = scrollbarContainer.clientHeight;
                const thumbHeight = Math.max(30, Math.round((containerHeight / (containerHeight + maxScrollY)) * containerHeight));
                scrollbarThumb.style.height = `${thumbHeight}px`;

                const maxThumbTop = containerHeight - thumbHeight;
                const percent = scrollY / maxScrollY;
                const thumbTop = percent * maxThumbTop;
                scrollbarThumb.style.top = `${Math.min(maxThumbTop, Math.max(0, thumbTop))}px`;
            }

            ipcRenderer.on('scroll-update', (event, data) => {
                updateScrollbarThumb(data.scrollY, data.maxScrollY);
            });

            // Track window resize to re-check scrollbar
            window.addEventListener('resize', () => {
                ipcRenderer.invoke('get-scroll-state').then(state => {
                    if (state) updateScrollbarThumb(state.scrollY, state.maxScrollY);
                });
            });

            // Initial fetch of scroll state
            setTimeout(() => {
                ipcRenderer.invoke('get-scroll-state').then(state => {
                    if (state) updateScrollbarThumb(state.scrollY, state.maxScrollY);
                });
            }, 500);

            scrollbarThumb.addEventListener('mousedown', (e) => {
                isDraggingScrollbar = true;
                startDragY = e.clientY;
                startThumbTop = parseInt(scrollbarThumb.style.top || '0');
                scrollbarThumb.classList.add('active');
                document.body.style.userSelect = 'none';
                
                e.preventDefault();
                e.stopPropagation();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDraggingScrollbar) return;
                
                const deltaY = e.clientY - startDragY;
                const containerHeight = scrollbarContainer.clientHeight;
                const thumbHeight = scrollbarThumb.clientHeight;
                const maxThumbTop = containerHeight - thumbHeight;
                
                let newThumbTop = startThumbTop + deltaY;
                newThumbTop = Math.min(maxThumbTop, Math.max(0, newThumbTop));
                
                const percent = maxThumbTop > 0 ? (newThumbTop / maxThumbTop) : 0;
                const targetScrollY = percent * maxScrollY;
                
                ipcRenderer.send('set-scroll-y', targetScrollY);
            });

            document.addEventListener('mouseup', () => {
                if (isDraggingScrollbar) {
                    isDraggingScrollbar = false;
                    scrollbarThumb.classList.remove('active');
                    document.body.style.userSelect = '';
                }
            });

            // Listen to wheel events on index.html to scroll panels
            document.addEventListener('wheel', (e) => {
                ipcRenderer.send('scroll-ct-panels', { deltaY: e.deltaY > 0 ? 150 : -150 });
            }, { passive: true });
        })();</script>
<script>
(function() {
    try {
        if (typeof customElements !== 'undefined' && !customElements.get('webview')) {
            class WebViewElement extends HTMLElement {
                constructor() {
                    super();
                    const shadow = this.attachShadow({ mode: 'open' });
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    shadow.appendChild(iframe);
                    this._iframe = iframe;
                    
                    // Forward events from inner iframe to parent webview element
                    const self = this;
                    ['did-navigate', 'did-finish-load', 'console-message', 'did-fail-load'].forEach(evtName => {
                        iframe.addEventListener(evtName, function(e) {
                            const newEvt = new Event(evtName);
                            // Copy properties
                            for (let k in e) {
                                try { newEvt[k] = e[k]; } catch(err){}
                            }
                            self.dispatchEvent(newEvt);
                        });
                    });
                }
                static get observedAttributes() { return ['src']; }
                attributeChangedCallback(name, oldValue, newValue) {
                    if (name === 'src' && this._iframe) {
                        this._iframe.src = newValue;
                    }
                }
                get src() {
                    return this._iframe ? this._iframe.src : '';
                }
                set src(val) {
                    if (this._iframe) this._iframe.src = val;
                    this.setAttribute('src', val);
                }
                get name() {
                    return this._iframe ? this._iframe.name : '';
                }
                set name(val) {
                    if (this._iframe) this._iframe.name = val;
                    this.setAttribute('name', val);
                }
                loadURL(url, options) {
                    return HTMLIFrameElement.prototype.loadURL.call(this._iframe, url, options);
                }
                clearStorageData() { return Promise.resolve(); }
                setProxy() { return Promise.resolve(); }
                setCookies() { return Promise.resolve(); }
                getCookies() { return Promise.resolve([]); }
                setUserAgent() { return Promise.resolve(); }
            }
            customElements.define('webview', WebViewElement);
        }
    } catch (e) {
        console.warn('[Webview Shim] Native customElements.define bypassed:', e);
    }

    if (typeof HTMLIFrameElement !== 'undefined') {
        var originalSrcDescriptor = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'src');
        if (originalSrcDescriptor && originalSrcDescriptor.set) {
            Object.defineProperty(HTMLIFrameElement.prototype, 'src', {
                get: function() {
                    return originalSrcDescriptor.get.call(this);
                },
                set: function(val) {
                    originalSrcDescriptor.set.call(this, val);
                    var iframe = this;
                    setTimeout(function() {
                        iframe.dispatchEvent(new Event('did-navigate'));
                        iframe.dispatchEvent(new Event('did-finish-load'));
                    }, 50);
                }
            });
        }
        HTMLIFrameElement.prototype.loadURL = function(url, options) {
            var iframe = this;
            var htmlContent = '';
            
            if (url.startsWith('data:text/html,')) {
                htmlContent = decodeURIComponent(url.substring('data:text/html,'.length));
            } else if (url.startsWith('data:text/html;base64,')) {
                htmlContent = atob(url.substring('data:text/html;base64,'.length));
            } else {
                iframe.src = url;
                return Promise.resolve();
            }
            var baseUrl = (options && options.baseURLForDataURL) ? options.baseURLForDataURL : 'https://worker.captchatypers.com/';
            var frameId = 'frame_' + Math.random().toString(36).substring(2) + '_' + Date.now();
            if (!iframe.name) {
                iframe.name = frameId;
            }
            // Synchronous XHR ensures HTML is saved in memory before iframe navigates
            var captchaServer = (window.CAPTCHA_SERVER_URL || localStorage.getItem('CAPTCHA_SERVER_URL') || 'https://capearnauto-production.up.railway.app').replace(/\/+$/, '');
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', captchaServer + '/store_captcha_frame', false); // Synchronous
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.send(JSON.stringify({ id: frameId, html: htmlContent, domain: baseUrl }));
            } catch(e) {
                console.error('[Sync Store Error]', e);
            }
            iframe.src = captchaServer + '/render_captcha_frame?id=' + frameId;
            setTimeout(function() {
                var loadedEvt = new Event('console-message');
                loadedEvt.message = 'frame loaded !';
                iframe.dispatchEvent(loadedEvt);
                
                var loadedEvt2 = new Event('console-message');
                loadedEvt2.message = 'frame-onload';
                iframe.dispatchEvent(loadedEvt2);
                
                var activeEvt = new Event('console-message');
                activeEvt.message = 'detect-active';
                iframe.dispatchEvent(activeEvt);
                
                iframe.dispatchEvent(new Event('did-finish-load'));
                iframe.dispatchEvent(new Event('did-navigate'));
            }, 100);
            return Promise.resolve();
        };
        HTMLIFrameElement.prototype.clearStorageData = function() { return Promise.resolve(); };
        HTMLIFrameElement.prototype.setProxy = function() { return Promise.resolve(); };
        HTMLIFrameElement.prototype.setCookies = function() { return Promise.resolve(); };
        HTMLIFrameElement.prototype.getCookies = function() { return Promise.resolve([]); };
        HTMLIFrameElement.prototype.setUserAgent = function() { return Promise.resolve(); };
    }
    
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'ctor-console-event') {
            var msg = event.data.msg;
            if (msg === 'frame-load-error') {
                return;
            }
            var iframeId = event.data.iframeId;
            
            // 1. Dispatch event to standard iframes
            var iframes = document.querySelectorAll('iframe');
            iframes.forEach(function(iframe) {
                if (!iframeId || iframe.name === iframeId || iframes.length === 1) {
                    var evt = new Event('console-message');
                    evt.message = msg;
                    iframe.dispatchEvent(evt);
                }
            });
            
            // 2. Dispatch event to custom webview elements
            var webviews = document.querySelectorAll('webview');
            webviews.forEach(function(webview) {
                if (webview._iframe && (webview._iframe.name === iframeId || !iframeId || webviews.length === 1)) {
                    var evt = new Event('console-message');
                    evt.message = msg;
                    webview.dispatchEvent(evt);
                }
            });
        }
    });
})();
</script>
