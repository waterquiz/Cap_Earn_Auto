<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            width: 320px;
            padding: 20px;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), #0ea5e9);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow);
        }

        .status-header {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .status-badge {
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .pulse.online { background-color: var(--accent-green); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse-green 2s infinite; }
        .pulse.offline { background-color: var(--accent-red); }
        .pulse.checking { background-color: var(--accent-orange); animation: pulse-orange 2s infinite; }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes pulse-orange {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .grid-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .grid-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 13px;
        }

        .grid-name { color: var(--text-secondary); }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
        }

        .version {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🤖</div>
        <h1>reCAPTCHA Pro</h1>
    </div>

    <div class="status-card">
        <div class="status-header">
            <span>Global Status</span>
            <div id="mainBadge" class="status-badge">
                <div id="mainPulse" class="pulse checking"></div>
                <span id="mainStatusText">Checking...</span>
            </div>
        </div>
        
        <div class="grid-list">
            <div class="grid-item">
                <span class="grid-name">3x3 Detection</span>
                <span id="status3x3" class="status-badge">Checking</span>
            </div>
            <div class="grid-item">
                <span class="grid-name">4x4 Segmentation</span>
                <span id="status4x4" class="status-badge">Checking</span>
            </div>
        </div>
    </div>

    <button id="refreshBtn">
        <span>🔄</span> Refresh Node Status
    </button>

    <div class="footer">
        <div class="version">v2.0.0 Stable</div>
        <div>Engine: Hugging Face Cloud AI</div>
        <div>No local server required. Automation Active.</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
