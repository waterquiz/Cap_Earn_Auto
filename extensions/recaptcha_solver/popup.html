<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JA CAPTCHA</title>
<style>

body {
  margin:0;
  width: 350px;
  height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Poppins',sans-serif;
  background: radial-gradient(circle at top, #0d0d0d, #00120a 90%);
  overflow:hidden;
}

/* CARD - Improved depth with a premium dark gradient and cyber glow */
.card {
  width:320px;
  padding:20px;
  border-radius:28px;
  text-align:center;
  background: linear-gradient(135deg, rgba(10, 10, 10, 0.95), rgba(0, 25, 12, 0.95));
  box-shadow: 0 15px 40px rgba(0, 255, 102, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(0, 255, 102, 0.15);
}

/* TITLE - Kept your original golden and blue colors with better glowing effect */
.title {
  font-size:26px;
  font-weight:900;
  margin:5px 0 10px;
  letter-spacing: 0.5px;
}
.title .ja { color:#FFD700; text-shadow:0 0 15px rgba(255, 215, 0, 0.6); }
.title .captcha { color:#0088cc; text-shadow:0 0 12px rgba(0, 136, 208, 0.6); }

/* STATUS - Modernized text and dot layout */
.status {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  font-weight:700;
  color:#00FF66;
  margin-bottom:15px;
  font-size: 13px;
  letter-spacing: 0.5px;
}
.dot {
  width:9px; height:9px;
  border-radius:50%;
  background:#00FF66;
  box-shadow:0 0 12px #00FF66;
  animation:dotPulse 1s infinite alternate;
}
@keyframes dotPulse { 0% {transform:scale(1); opacity:.4;} 100% {transform:scale(1.3); opacity:1;} }

/* LOGO - Clean floating animation */
.logo-wrap { width:95px; height:95px; margin:5px auto 18px; }
.logo { 
  width:95px; height:95px;
  border-radius:20px;
  box-shadow:0 0 25px rgba(0, 255, 153, 0.5); 
  animation:logoFloat 3s ease-in-out infinite alternate;
}
@keyframes logoFloat {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0px); }
}

/* BUTTONS - Enhanced matrix glassmorphism style with sharp response */
.links { 
  display:flex; 
  flex-direction:column; 
  gap:12px; 
  margin-bottom:15px; 
}
.btn {
  display:flex; 
  align-items:center; 
  justify-content:center; 
  gap:10px;
  padding:12px; 
  border-radius:16px;
  background: linear-gradient(135deg, rgba(0, 255, 102, 0.1), rgba(183, 237, 40, 0.1));
  border: 1px solid rgba(0, 255, 102, 0.4);
  color:#fff; 
  font-weight:600; 
  font-size:13.5px; 
  text-decoration:none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, #00FF99, #b7ed28);
  color: #000;
  font-weight: 700;
  box-shadow: 0 0 25px rgba(0, 255, 120, 0.6);
  border-color: transparent;
}
.btn img { width:20px; height:20px; transition: transform 0.25s; }
.btn:hover img { transform: scale(1.1); filter: drop-shadow(0 0 2px rgba(0,0,0,0.3)); }

/* FOOTER - Refined layout and styling */
.footer {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin-top:12px;
  font-size:11px;
  font-weight:500;
  color:#888;
  border-top: 1px solid rgba(255,255,255,0.05);
  padding-top:12px;
}
.footer a {
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  color:#ccc;
  transition: color 0.2s;
}
.footer a:hover { color: #00FF99; }
.footer img { width:15px; height:15px; }

.footer div { display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.footer .email { color:#00FF66; font-weight:600; letter-spacing: 0.3px; display: inline-flex; align-items: center; gap: 6px; }

/* BRANDING ANIMATION - Golden neon pulse effect for copyright */
.copyright-text {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 4px;
  animation: copyrightPulse 2s ease-in-out infinite alternate;
}

@keyframes copyrightPulse {
  0% { color: #b5b5b5; text-shadow: 0 0 0px transparent; }
  100% { color: #FFD700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
}
</style>
</head>
<body>
<div class="card">
  <div class="title">
    <span class="ja">JA</span> <span class="captcha">CAPTCHA</span>
  </div>

  <div class="status">
    <div class="dot"></div>
    <span>ACTIVATED</span>
  </div>

  <div class="logo-wrap">
    <img src="icons/icon128.png" class="logo" alt="Logo">
  </div>

  <div class="links">
    <a class="btn" href="https://t.me/JACAPTCHA" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram"> Contact Telegram
    </a>
    <a class="btn" href="https://t.me/KolotibabloOfficialUpdates" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram"> Telegram Official Channel
    </a>
  </div>

  <div class="footer">
    <div>
      <a href="https://www.youtube.com/@KolotibabloOfficial" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" alt="YouTube"> Subscribe YouTube Channel
      </a>
    </div>
    <div>
      <span class="email">
        <img src="https://tse2.mm.bing.net/th/id/OIP.ox3N1Ro-28jyoFvyJrAFYQHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Email Icon"> Contact Email: jacaptchaofficial@gmail.com
      </span>
    </div>
    <div class="copyright-text">© 2026 JA CAPTCHA</div>
  </div>
</div>
</body>
</html>
