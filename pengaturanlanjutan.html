<!doctype html><html><head><meta charset="UTF-8"><title>Advanced Settings</title><link rel="stylesheet" href="./template/styles/settings.css"></head><body><header id="settings-header"><h2>Display & Proxy Settings</h2></header><div class="settings-container"><div class="settings-section"><h4>PANEL DISPLAY</h4><div class="settings-group"><label for="column-slider">Column Count <span class="tooltip-text" title="Set the number of panels displayed side-by-side (horizontal).">[?]</span></label><div class="control"><input type="range" id="column-slider" min="1" max="100" value="2"> <input type="number" id="column-input" class="value-input" min="1" max="100" value="2"></div></div><div class="settings-group"><label for="height-slider">Panel Height (px) <span class="tooltip-text" title="Set the height of each panel area in pixels.">[?]</span></label><div class="control"><input type="range" id="height-slider" min="100" max="5000" value="300" step="10"> <input type="number" id="height-input" class="value-input" min="100" max="5000" step="10" value="300"></div></div></div><div class="settings-section"><h4>CAPTCHA SOLVER SETTINGS</h4><div class="settings-group"><label for="auto-solve-select">Auto Solve Captcha Challenge <span class="tooltip-text" title="JA Enabled: Use JA CAPTCHA local AI (ONNX/YOLOv5) to solve reCAPTCHA v2 image challenges offline&#10;Audio Enabled: Use audio transcription to solve reCAPTCHA v2 challenges&#10;Disabled: Stop all automatic challenge solving">[?]</span></label><div class="control"><select id="auto-solve-select"><option value="recaptcha_v2_local" selected="selected">JA Enabled (Auto Solve)</option><option value="audio">Audio Enabled (Auto Solve)</option><option value="false">Disabled (Stop Auto Solve)</option></select></div></div><div class="settings-group"><label for="solver-engine-select">Active Solver Engine <span class="tooltip-text" title="CaptchaSonic / CaptchaAI Userscript: Automatically enabled by default to solve hCaptcha using CaptchaSonic API&#10;Custom URL AI Solver (Qwen API): Use custom Qwen API URL solver (CaptchaSonic disabled)">[?]</span></label><div class="control"><select id="solver-engine-select"><option value="captchasonic" selected="selected">CaptchaSonic / CaptchaAI Userscript</option><option value="custom_url">Custom URL AI Solver (Qwen API)</option></select></div></div></div><div class="settings-section"><h4>PROXY SETTINGS</h4><div class="settings-group"><label for="proxy-mode-toggle">Proxy Mode <span class="tooltip-text" title="No Proxies: Do not use proxies&#10;Manual Proxies: Enter your own proxy list">[?]</span></label><div class="control"><select id="proxy-mode-select"><option value="none" selected="selected">No Proxies</option><option value="manual">Manual Proxies</option></select></div></div><div class="settings-group" id="manual-proxy-section" style="display: none; flex-direction: column; align-items: flex-start;"><label for="manual-proxy-input">Manual Proxy (one per line) <span class="tooltip-text" title="Format: ip:port:username:password&#10;Example: 192.168.1.1:8080:user:pass">[?]</span></label> <textarea id="manual-proxy-input" rows="6" placeholder="192.168.1.1:8080:user:pass&#10;45.38.111.213:6128:username:password&#10;23.26.61.141:5607:username:password" style="width: 100%; margin-top: 10px;"></textarea></div></div></div><div class="actions"><button id="save-settings-btn">Save & Apply</button></div><script src="./settings-renderer.js"></script></body></html>
